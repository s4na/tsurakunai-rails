# Compatibility preset; current defaults also enforce explicit flow.
TsurakunaiRails/ControllerCallbacks:
  Enabled: true
TsurakunaiRails/DefaultScope:
  Enabled: true
TsurakunaiRails/ValidationBypass:
  Enabled: true
TsurakunaiRails/ModelRequestContext:
  Enabled: true
Rails/EnumHash:
  Enabled: true
Rails/SaveBang:
  Enabled: true
