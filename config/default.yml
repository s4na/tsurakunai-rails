inherit_from: rspec.yml

plugins:
  - rubocop-rails
  - rubocop-rspec

# Opinionated design defaults; unrelated upstream styles remain disabled.
Rails:
  Enabled: false

Rails/ActiveRecordOverride:
  Enabled: true
  AutoCorrect: false
Rails/DuplicateAssociation:
  Enabled: true
  AutoCorrect: false
Rails/AddColumnIndex:
  Enabled: true
  AutoCorrect: false
Rails/DangerousColumnNames:
  Enabled: true
  AutoCorrect: false
Rails/AfterCommitOverride:
  Enabled: true
  AutoCorrect: false
Rails/NotNullColumn:
  Enabled: true
  AutoCorrect: false
Rails/EnumUniqueness:
  Enabled: true
  AutoCorrect: false
Rails/EnumHash:
  Enabled: true
  AutoCorrect: false
Rails/SaveBang:
  Enabled: true
  AutoCorrect: false
  AllowImplicitReturn: true
Rails/HasManyOrHasOneDependent:
  Enabled: true
  AutoCorrect: false
Rails/UniqueValidationWithoutIndex:
  Enabled: true
  AutoCorrect: false
Rails/UnusedRenderContent:
  Enabled: true
  AutoCorrect: false

TsurakunaiRails/ControllerCallbacks:
  Description: Keep action flow explicit; approve framework hooks by name.
  Enabled: true
  VersionAdded: '0.1'
  AllowedMethods: []
  Include:
    - '**/app/controllers/**/*.rb'
    - '**/app/controllers/concerns/**/*.rb'

TsurakunaiRails/DefaultScope:
  Description: Make query filtering and creation defaults explicit.
  Enabled: true
  VersionAdded: '0.1'
  Include:
    - '**/app/models/**/*.rb'

TsurakunaiRails/ValidationBypass:
  Description: Review writes which explicitly skip validation.
  Enabled: true
  VersionAdded: '0.1'
  Include:
    - '**/app/models/**/*.rb'

TsurakunaiRails/ModelRequestContext:
  Description: Keep HTTP request context out of persistence and business behavior.
  Enabled: true
  VersionAdded: '0.1'
  AllowedMethods: []
  Include:
    - '**/app/models/**/*.rb'

TsurakunaiRails/ModelCallbacks:
  Description: Keep business operations out of implicit persistence hooks.
  Enabled: true
  VersionAdded: '0.1'
  AllowedCallbacks: {}
  Include:
    - '**/app/models/**/*.rb'

TsurakunaiRails/ImplicitContext:
  Description: Make context explicit outside the HTTP boundary.
  Enabled: true
  VersionAdded: '0.1'
  AllowedConstants: []
  Include:
    - '**/app/models/**/*.rb'
    - '**/app/jobs/**/*.rb'
    - '**/app/operations/**/*.rb'
    - '**/app/services/**/*.rb'
    - '**/app/queries/**/*.rb'
    - '**/app/forms/**/*.rb'
    - '**/app/helpers/**/*.rb'
    - '**/app/components/**/*.rb'

TsurakunaiRails/Concern:
  Description: Prefer explicit collaborators to business mixins.
  Enabled: true
  VersionAdded: '0.1'
  Include:
    - '**/app/models/**/*.rb'
    - '**/app/controllers/**/*.rb'
    - '**/app/operations/**/*.rb'
    - '**/app/services/**/*.rb'
