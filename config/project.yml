# Generated by init-policy. Merge inherit_from into your existing .rubocop.yml.
# Keep team decisions in RAILS_TEAM_POLICY.md alongside these overrides.
plugins:
  - rubocop-tsurakunai-rails

TsurakunaiRails/ControllerCallbacks:
  # Add only hooks required by your authentication/framework infrastructure.
  # AllowedMethods applies to every included controller, not just one class.
  AllowedMethods: []

TsurakunaiRails/ModelCallbacks:
  # Example after team agreement: before_validation: [normalize_email]
  # Name approval does not verify the method body. Review its implementation.
  AllowedCallbacks: {}
